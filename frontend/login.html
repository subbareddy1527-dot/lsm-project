<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Student Login</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<nav>

<div class="logo">
After School Coding
</div>

<a href="index.html">
Home
</a>

</nav>

<section>

<div class="form-container">

<div class="form-box">

<h1>
Student Login
</h1>

<form onsubmit="loginStudent(event)">

<label>
Email
</label>

<input
type="email"
name="email"
placeholder="Enter email"
required
>

<label>
Password
</label>

<input
type="password"
name="password"
placeholder="Enter password"
required
>

<button
type="submit"
class="btn"
>
Login
</button>

</form>

<p>
New student?
<a href="register.html">
Create Account
</a>
</p>

</div>

</div>

</section>

<script src="script.js"></script>

</body>

</html>
